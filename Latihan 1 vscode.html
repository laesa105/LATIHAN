<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Toko Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .product {
            background: white;
            border: 1px solid #ddd;
            margin: 10px;
            padding: 15px;
            width: 200px;
            text-align: center;
            border-radius: 8px;
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #218838;
        }
        #cart {
            position: fixed;
            right: 10px;
            top: 70px;
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            width: 250px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>Toko Online Sederhana</h1>
</header>

<div class="container">
    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Produk 1">
        <h3>Kaos Polos</h3>
        <p>Rp 50.000</p>
        <button onclick="addToCart('Kaos Polos', 50000)">Tambah</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Produk 2">
        <h3>Sepatu Sneakers</h3>
        <p>Rp 150.000</p>
        <button onclick="addToCart('Sepatu Sneakers', 150000)">Tambah</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Produk 3">
        <h3>Topi Keren</h3>
        <p>Rp 30.000</p>
        <button onclick="addToCart('Topi Keren', 30000)">Tambah</button>
    </div>
</div>

<div id="cart">
    <h3>Keranjang</h3>
    <ul id="cart-items"></ul>
    <p><strong>Total: Rp <span id="total">0</span></strong></p>
</div>

<script>
    let total = 0;

    function addToCart(name, price) {
        const cartItems = document.getElementById("cart-items");

        let li = document.createElement("li");
        li.textContent = name + " - Rp " + price;
        cartItems.appendChild(li);

        total += price;
        document.getElementById("total").textContent = total;
    }
</script>

</body>
</html>
